<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tchai Kim</title>
  <meta name="description" content="Where tradition finds freedom. Enter the Tchai Kim website.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Trirong:wght@400;600;700&display=swap">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.css">

  <link rel="stylesheet" href="../../common/css/tokens.css">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/common.css">
  <link rel="stylesheet" href="css/intro.css">
</head>

<!-- 인트로는 독립된 진입 화면입니다. 공통 헤더·푸터를 넣지 않습니다 —
     화면에는 두루마기 영상과 START 버튼만 있고, 그 버튼으로만 메인으로 넘어갑니다.
     그래서 common/css/layout.css(헤더·푸터 레이아웃)도 불러오지 않습니다. -->
<body data-page="intro">

  <main class="intro" id="main_content">

    <!-- 두루마기 영상. Figma 'intro_open'(1561:2140) 기준 카피/아이콘.
         js/intro.js가 있고 1280px 이상 + 모션 허용이면 화면에 붙잡힌 채(pin)
         스크롤 진행률을 영상 재생 시간(0~4.04초)에 그대로 매핑합니다
         (스크럽 — 재생이 아니라 스크롤한 만큼만 진행). 3초 지점부터
         .scroll_overlay(안내 문구·START 버튼·소셜 아이콘)가 페이드인해
         영상이 끝나는 4초에 완전히 보입니다 — 두루마리가 다 펼쳐져야 그 위에
         적힌 내용이 읽히는 것과 같은 순서입니다. 조건이 안 맞으면 영상이 그냥
         무한 반복 재생되고 오버레이는 항상 보입니다. -->
    <section class="scroll" aria-labelledby="scroll_title">
      <h1 class="a11y_hidden" id="scroll_title">Tchai Kim — Where tradition finds freedom</h1>

      <div class="scroll_stage">
        <video class="scroll_video" src="assets/intro.mp4" muted loop autoplay playsinline preload="auto" aria-hidden="true"></video>

        <div class="scroll_overlay">
          <p class="scroll_overlay_eyebrow">Where tradition finds freedom</p>

          <!-- 이 버튼이 사이트로 들어가는 유일한 입구입니다.
               에셋 파일 이름은 brand_btn_book.png지만 그림은 START 도장입니다
               (brand 페이지에서 넘어온 이름이라 그대로 두었습니다). -->
          <a class="scroll_overlay_book" href="../main/index.html">
            <img src="assets/brand_btn_book.png" alt="Start — enter the Tchai Kim website" width="80" height="80">
          </a>

          <ul class="scroll_overlay_social">
            <li>
              <a href="https://www.instagram.com/tchaikim/" target="_blank" rel="noopener noreferrer">
                <img src="assets/icons/Instagram.svg" alt="" aria-hidden="true">
                <span class="a11y_hidden">Instagram (opens in a new tab)</span>
              </a>
            </li>
            <li>
              <a href="#" target="_blank" rel="noopener noreferrer">
                <img src="assets/icons/Facebook.svg" alt="" aria-hidden="true">
                <span class="a11y_hidden">Facebook (opens in a new tab)</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="../../common/js/common.js"></script>
<script src="js/intro.js"></script>

</body>

</html>
